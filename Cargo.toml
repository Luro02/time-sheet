[package]
name = "time-sheet"
version = "0.1.0"
edition = "2024"
authors = ["Luro02"]
description = "A time sheet generator for the german university KIT"

[features]
default = ["lettre"]

[dependencies]
# parsing stuff

serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = { version = "1.1", features = ["preserve_order"] }

# utility
anyhow = "1"
thiserror = "2"
derive_more = { version = "2.1", features = ["full"] }
tempfile = "3"
rust-embed = "8.12"
fs_extra = "1.3"
v_latexescape = "0.16"
static_assertions = "1.1"
dunce = "1.0"
formatx = "0.4"

# can be removed once const-fns panic can have arguments
const_panic = "0.2"

# make backtraces beautiful
color-backtrace = "0.7"

# used for logging
log = "0.4"
pretty_env_logger = "0.5"

# cli
argh = { version = "0.1", default-features = false, features = ["help"] }

[dependencies.lettre]
version = "0.11"
default-features = false
features = ["smtp-transport", "pool", "hostname", "builder", "rustls-tls"]
optional = true

[dev-dependencies]
pretty_assertions = "1.4"
time = { version = "0.3", default-features = false }
minreq = { version = "3", features = ["https"] }

[profile.release]
strip = "debuginfo"
lto = "fat"
